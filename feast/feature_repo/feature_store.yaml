# Local development config.
# In-cluster, the Feast operator CR (feast-operator.yaml) overrides these backends.
#
# For local `feast apply` / `feast materialize` against the dev cluster:
#   export AWS_ENDPOINT_URL_S3=https://minio-s3-smartshop.apps.<cluster-domain>
#   export AWS_ACCESS_KEY_ID=<key>
#   export AWS_SECRET_ACCESS_KEY=<secret>
#   export REDIS_HOST=<port-forward-host>
#   export REDIS_PORT=6379
#   export REDIS_PASSWORD=<password>
#   export PG_USER=<user>  PG_PASSWORD=<password>  PG_HOST=localhost  PG_DATABASE=mlflow
project: smartshop
provider: local

# SQL registry — matches in-cluster FeatureStore CR (file registry.db blocks concurrent writes).
registry:
  registry_type: sql
  path: "postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@${PG_HOST:-localhost}:5432/${PG_DATABASE:-mlflow}"
  cache_mode: thread
  cache_ttl_seconds: 60

# dask offline store (file-based) — matches in-cluster FeatureStore CR.
offline_store:
  type: file

online_store:
  type: redis
  connection_string: "${REDIS_HOST:-localhost}:${REDIS_PORT:-6379},password=${REDIS_PASSWORD}"

entity_key_serialization_version: 3
