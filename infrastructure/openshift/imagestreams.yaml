  namespace: ${NAMESPACE}
spec:
  lookupPolicy:
    local: true   # pods in this namespace can reference 'spark-jobs:latest' directly
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: spark-jobs-rapids
  namespace: ${NAMESPACE}
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: rec-trainer
  namespace: ${NAMESPACE}
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: llm-trainer
  namespace: ${NAMESPACE}
spec:
  lookupPolicy:
    local: true
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: rec-server
  namespace: ${NAMESPACE}
spec:
  lookupPolicy:
    local: true
