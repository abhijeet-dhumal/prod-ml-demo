apiVersion: batch/v1
kind: Job
metadata:
  name: minio-set-jars-public
  namespace: smartshop
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:latest
          command: [sh, -c]
          args:
            - |
              mc alias set minio http://minio.smartshop.svc.cluster.local:9000 \
                $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY
              mc anonymous set download minio/smartshop-raw/jars
              echo "Policy set: jars/ is now public-read"
          envFrom:
            - secretRef:
                name: smartshop-credentials
