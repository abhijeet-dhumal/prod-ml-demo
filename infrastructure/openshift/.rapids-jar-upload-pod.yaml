apiVersion: v1
kind: Pod
metadata:
  name: rapids-jar-upload
  namespace: smartshop
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 0
  containers:
    - name: uploader
      image: quay.io/abdhumal/smartshop-spark-jobs-rapids:latest
      securityContext:
        runAsUser: 0
      command: [sh, -c]
      args:
        - |
          set -e
          echo "JAR: $(ls -lh /opt/spark/jars/rapids-4-spark.jar)"

          # Check if already uploaded
          if curl -sf -o /dev/null --max-time 10 \
            "http://minio.smartshop.svc.cluster.local:9000/smartshop-raw/jars/rapids-4-spark.jar"; then
            echo "Already in MinIO — skip"
            exit 0
          fi

          # Install mc
          echo "Installing mc..."
          curl -fsSL -o /usr/local/bin/mc \
            https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          mc --version

          export MC_CONFIG_DIR=/tmp/.mc
          mkdir -p /tmp/.mc
          mc alias set minio http://minio.smartshop.svc.cluster.local:9000 \
            "${AWS_ACCESS_KEY_ID}" "${AWS_SECRET_ACCESS_KEY}"

          echo "Uploading rapids-4-spark.jar (~846MB) ..."
          mc cp /opt/spark/jars/rapids-4-spark.jar \
             minio/smartshop-raw/jars/rapids-4-spark.jar

          echo "Setting anonymous read on jars..."
          mc anonymous set download minio/smartshop-raw/jars

          echo "=== Done ==="
          mc ls minio/smartshop-raw/jars/
      envFrom:
        - secretRef:
            name: smartshop-credentials
      resources:
        requests: {cpu: "2", memory: 2Gi}
        limits: {cpu: "4", memory: 4Gi}
