---
# FeatureStore CR — SmartShop AI
#
# Uses SparkOfflineStore + SparkComputeEngine (feast-spark-server custom image).
# Services run in one shared Deployment (feast-smartshop-feast).
#
# Init containers are disabled — feast apply and feast materialize are run manually
# via oc exec after the pod starts. This avoids the init container using the default
# feast[minimal] image (which lacks pyspark) when features.py imports SparkSource.
#
# Apply:
#   source .env
#   envsubst < infrastructure/openshift/feast-spark-engine.yaml | oc apply -f -
#   envsubst < infrastructure/openshift/feast-operator.yaml | oc apply -f -
#
# After pod Ready, run Phase 4d commands from docs/TODO.md.
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: smartshop-feast
  namespace: ${NAMESPACE}
  labels:
    feature-store-ui: enabled
spec:
  feastProject: smartshop

  # batchEngine: injects batch_engine: {type: spark.engine, spark_conf: {...}}
  # into feature_store.yaml via the feast-spark-engine ConfigMap.
  batchEngine:
    configMapRef:
      name: feast-spark-engine

  services:
    # Disable init containers — feast apply runs manually after pod starts
    # (default feast[minimal] image in init containers lacks pyspark / SparkSource)
    disableInitContainers: true

    offlineStore:
      persistence:
        store:
          # type: spark → SparkOfflineStore; secret key "spark" holds spark_conf
          type: spark
          secretRef:
            name: feast-spark-config
      server:
        # Custom image: feature-server:0.62.0 + pyspark==4.0.0 + hadoop-aws JARs
        image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/feast-spark-server:latest
        envFrom:
          - secretRef:
              name: feast-s3-credentials  # AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY

    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-redis-secret
      server:
        image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/feast-spark-server:latest
        envFrom:
          - secretRef:
              name: feast-s3-credentials

    registry:
      local:
        persistence:
          file:
            path: registry.db
            pvc:
              # Reuse existing PVC if already created; operator is idempotent
              create:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
                storageClassName: nfs-csi
              mountPath: /feast-registry
        server:
          image: image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/feast-spark-server:latest
          envFrom:
            - secretRef:
                name: feast-s3-credentials
          restAPI: true

    ui: {}
