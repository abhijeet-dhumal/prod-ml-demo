---
# feast-spark-engine ConfigMap
# Referenced by spec.batchEngine.configMapRef in the FeatureStore CR.
# The operator injects this as batch_engine: {...} into feature_store.yaml.
# type: spark.engine → SparkComputeEngine (runs SparkSession local[*] inside feast pod).
apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-spark-engine
  namespace: ${NAMESPACE}
data:
  config: |
    type: spark.engine
    partitions: 200
    spark.master: "k8s://https://api.oai-kft-ibm.ibm.rh-ods.com:6443"
    spark.kubernetes.namespace: "${NAMESPACE}"
    spark.kubernetes.container.image: "${FEAST_SERVER_IMAGE}"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.driver.bindAddress: "0.0.0.0"
    spark.driver.host: "feast-smartshop-feast-offline.${NAMESPACE}.svc.cluster.local"
    spark.driver.port: "7078"
    spark.driver.blockManager.port: "7079"
    spark.driver.memory: "4g"
    spark.driver.cores: "2"
    spark.executor.memory: "8g"
    spark.executor.cores: "4"
    spark.executor.instances: "4"
    spark.kubernetes.executor.request.cores: "100m"
    spark.kubernetes.driver.volumes.emptyDir.spark-work-dir.mount.path: "/opt/spark/work-dir"
    spark.kubernetes.executor.volumes.emptyDir.spark-work-dir.mount.path: "/opt/spark/work-dir"
    spark.sql.session.timeZone: "UTC"
    spark.sql.shuffle.partitions: "200"
    spark.default.parallelism: "200"
    spark.sql.execution.arrow.pyspark.enabled: "true"
    spark.sql.execution.arrow.fallback.enabled: "true"
    spark.sql.execution.arrow.maxRecordsPerBatch: "50000"
    spark.task.maxFailures: "3"
    spark.executor.maxNumFailures: "3"
    spark.hadoop.fs.s3a.endpoint: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.connection.maximum: "100"
    spark.hadoop.fs.s3a.threads.max: "64"

---
# feast-spark-config Secret
# Referenced by spec.services.offlineStore.persistence.store.secretRef.
# Key name must match the offline store type: "spark".
# Content is merged into feature_store.yaml under offline_store (excluding type).
#
# spark.master: local[*] — SparkSession runs in-process inside the feast pod.
# EnvironmentVariableCredentialsProvider reads AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
# from the feast-s3-credentials envFrom (already mounted on all feast containers).
apiVersion: v1
kind: Secret
metadata:
  name: feast-spark-config
  namespace: ${NAMESPACE}
stringData:
  spark: |
    spark_conf:
      spark.master: "local[*]"
      spark.ui.enabled: "false"
      spark.eventLog.enabled: "false"
      spark.sql.session.timeZone: "UTC"
      spark.sql.execution.arrow.pyspark.enabled: "true"
      spark.sql.execution.arrow.fallback.enabled: "true"
      spark.sql.shuffle.partitions: "200"
      spark.default.parallelism: "200"
      spark.driver.memory: "8g"
      spark.executor.memory: "8g"
      spark.sql.execution.arrow.maxRecordsPerBatch: "50000"
      spark.hadoop.fs.s3a.endpoint: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
      spark.hadoop.fs.s3a.path.style.access: "true"
      spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
      spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
      spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
      spark.hadoop.fs.s3a.connection.maximum: "100"
      spark.hadoop.fs.s3a.threads.max: "64"
    staging_location: "s3://smartshop-features/feast-staging/"
