apiVersion: batch/v1
kind: Job
metadata:
  name: minio-set-policy2
  namespace: smartshop
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: minio/mc:latest
          command: [sh, -c]
          args:
            - |
              export MC_CONFIG_DIR=/tmp/.mc
              mkdir -p /tmp/.mc
              mc alias set minio http://minio.smartshop.svc.cluster.local:9000 \
                $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY --api s3v4
              echo "Alias set, listing bucket..."
              mc ls minio/smartshop-raw/jars/
              echo "Setting anonymous download on jars prefix..."
              mc anonymous set download minio/smartshop-raw/jars
              echo "Verifying..."
              mc anonymous get minio/smartshop-raw/jars
          envFrom:
            - secretRef:
                name: smartshop-credentials
